<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Snake Game</title>
    <link rel="stylesheet" href="snake.css".css">
</head>
<body>

    <div class="game-container">
        <!-- Header & Scores -->
        <div class="header">
            <div class="title">SNAKE</div>
            <div class="score-board">
                <div class="score-box">
                    <div class="score-label">Score</div>
                    <div class="score-value" id="currentScore">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">High Score</div>
                    <div class="score-value" id="highScore">0</div>
                </div>
            </div>
        </div>

        <!-- Canvas and Overlay Container -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <!-- Game Over / Pause Overlay -->
            <div class="overlay" id="gameOverlay">
                <div class="overlay-title" id="overlayTitle">Press Start</div>
                <div class="overlay-subtitle" id="overlaySubtitle">Use WASD or Arrow Keys</div>
                <button class="btn btn-primary" id="overlayBtn" style="margin-top: 8px;">Start Game</button>
            </div>
        </div>

        <!-- Action Control Buttons -->
        <div class="controls-row">
            <button class="btn btn-primary" id="startBtn">Start</button>
            <button class="btn btn-secondary" id="pauseBtn" disabled>Pause</button>
            <button class="btn btn-secondary" id="resetBtn">Restart</button>
        </div>

        <!-- Touch Controls for Mobile Devices -->
        <div class="d-pad">
            <button class="d-btn d-up" id="btnUp">▲</button>
            <button class="d-btn d-left" id="btnLeft">◄</button>
            <button class="d-btn d-right" id="btnRight">►</button>
            <button class="d-btn d-down" id="btnDown">▼</button>
        </div>

        <div class="instructions">
            Controls: Arrow Keys / WASD | Space: Pause
        </div>
    </div>

    <script>
        // Game Constants & Configuration
        const CANVAS_SIZE = 400;
        const GRID_SIZE = 20; // 20x20 grid
        const TILE_COUNT = CANVAS_SIZE / GRID_SIZE;
        const GAME_SPEED = 100; // ms per frame

        // DOM Elements
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const currentScoreEl = document.getElementById('currentScore');
        const highScoreEl = document.getElementById('highScore');
        const overlay = document.getElementById('gameOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySubtitle = document.getElementById('overlaySubtitle');
        const overlayBtn = document.getElementById('overlayBtn');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Game State Variables
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = GRID_SIZE; // Current velocity X
        let dy = 0;         // Current velocity Y
        let nextDx = GRID_SIZE; // Prevent rapid multi-key turns
        let nextDy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snake_high_score') || 0;
        let gameInterval = null;
        let isRunning = false;
        let isPaused = false;

        // Initialize display
        highScoreEl.textContent = highScore;

        // Initialize Game State
        function initGame() {
            snake = [
                { x: 5 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 4 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 3 * GRID_SIZE, y: 10 * GRID_SIZE }
            ];
            score = 0;
            currentScoreEl.textContent = score;
            dx = GRID_SIZE;
            dy = 0;
            nextDx = GRID_SIZE;
            nextDy = 0;
            spawnFood();
            draw();
        }

        // Generate Random Food Position
        function spawnFood() {
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
                food.y = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
                
                // Ensure food does not spawn on the snake
                validPosition = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        function startGame() {
            if (isRunning && !isPaused) return;

            if (isPaused) {
                isPaused = false;
            } else {
                initGame();
            }

            isRunning = true;
            overlay.classList.add('hidden');
            pauseBtn.disabled = false;
            pauseBtn.textContent = 'Pause';
            
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, GAME_SPEED);
        }

        function pauseGame() {
            if (!isRunning) return;

            if (isPaused) {
                startGame();
            } else {
                isPaused = true;
                clearInterval(gameInterval);
                overlayTitle.textContent = "Paused";
                overlaySubtitle.textContent = "Press Resume or Space to continue";
                overlayBtn.textContent = "Resume";
                overlay.classList.remove('hidden');
                pauseBtn.textContent = 'Resume';
            }
        }

        function gameOver() {
            isRunning = false;
            isPaused = false;
            clearInterval(gameInterval);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_high_score', highScore);
                highScoreEl.textContent = highScore;
            }

            overlayTitle.textContent = "Game Over!";
            overlaySubtitle.textContent = `Your final score: ${score}`;
            overlayBtn.textContent = "Play Again";
            overlay.classList.remove('hidden');

            pauseBtn.disabled = true;
            pauseBtn.textContent = 'Pause';
        }

        function gameLoop() {
            // Apply queued directional changes
            dx = nextDx;
            dy = nextDy;

            // Calculate new Head position
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Check Wall Collisions
            if (head.x < 0 || head.x >= CANVAS_SIZE || head.y < 0 || head.y >= CANVAS_SIZE) {
                gameOver();
                return;
            }

            // Check Self Collision
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    gameOver();
                    return;
                }
            }

            // Add Head to Snake
            snake.unshift(head);

            // Check Food Collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                currentScoreEl.textContent = score;
                spawnFood();
            } else {
                snake.pop(); // Remove tail if no food eaten
            }

            draw();
        }

        function draw() {
            // Clear Canvas Background
            ctx.fillStyle = '#0b1120';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Draw Subtle Grid Lines
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < CANVAS_SIZE; i += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, CANVAS_SIZE);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(CANVAS_SIZE, i);
                ctx.stroke();
            }

            // Draw Food
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            const radius = GRID_SIZE / 2;
            ctx.arc(food.x + radius, food.y + radius, radius - 2, 0, Math.PI * 2);
            ctx.fill();

            // Draw Snake
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#4ade80' : '#22c55e'; // Head is slightly lighter green
                
                // Rounded segments for smooth UI
                const x = segment.x + 1;
                const y = segment.y + 1;
                const size = GRID_SIZE - 2;
                const borderRadius = 4;

                ctx.beginPath();
                ctx.roundRect(x, y, size, size, borderRadius);
                ctx.fill();
            });
        }

        function changeDirection(dir) {
            if (!isRunning || isPaused) return;

            switch (dir) {
                case 'UP':
                    if (dy === 0) { nextDx = 0; nextDy = -GRID_SIZE; }
                    break;
                case 'DOWN':
                    if (dy === 0) { nextDx = 0; nextDy = GRID_SIZE; }
                    break;
                case 'LEFT':
                    if (dx === 0) { nextDx = -GRID_SIZE; nextDy = 0; }
                    break;
                case 'RIGHT':
                    if (dx === 0) { nextDx = GRID_SIZE; nextDy = 0; }
                    break;
            }
        }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    changeDirection('UP');
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    changeDirection('DOWN');
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    changeDirection('LEFT');
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    changeDirection('RIGHT');
                    e.preventDefault();
                    break;
                case ' ':
                    pauseGame();
                    e.preventDefault();
                    break;
            }
        });

        // Event Listeners for UI Buttons
        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', pauseGame);
        resetBtn.addEventListener('click', () => {
            clearInterval(gameInterval);
            initGame();
            startGame();
        });
        overlayBtn.addEventListener('click', startGame);

        // Mobile On-Screen D-Pad Controls
        document.getElementById('btnUp').addEventListener('click', () => changeDirection('UP'));
        document.getElementById('btnDown').addEventListener('click', () => changeDirection('DOWN'));
        document.getElementById('btnLeft').addEventListener('click', () => changeDirection('LEFT'));
        document.getElementById('btnRight').addEventListener('click', () => changeDirection('RIGHT'));

        // Draw initial state on load
        initGame();
    </script>
</body>
</html>
